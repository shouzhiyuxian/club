{% extends "layout.html" %}

{% block content %}
<br>
<div class="container">
    <ul class="list-group">
        <li class="list-group-item list-group-item-dark">
            <i class="bi bi-key"></i>
            <strong>重置成员登录密码</strong>
        </li>
        <li class="list-group-item">
            <p class="text-muted">成员：{{ member.name }}（{{ member.member_id }}）</p>
            <form method="post">
                {% csrf_token %}
                {% for field in form %}
                <div class="mb-3">
                    <label>{{ field.label }}</label>
                    {{ field }}
                    <span style="color: red">{{ field.errors.0 }}</span>
                </div>
                {% endfor %}
                <div style="margin: 10px">
                    <button type="submit" class="btn btn-primary">确认重置</button>
                    <a href="/member/list" class="btn btn-secondary">返回</a>
                </div>
            </form>
        </li>
    </ul>
</div>
{% endblock %}
