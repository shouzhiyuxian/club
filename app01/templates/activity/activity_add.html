{% extends "layout.html" %}

{% block content %}
<br>
<div>
    <div class="container">
        <ul class="list-group">
            <li class="list-group-item list-group-item-dark">
                <i class="bi bi-calendar2-event-fill"></i>
                <strong>添加活动</strong>
            </li>
            <li class="list-group-item">
                <form method="post">
                    {% csrf_token %}
                    {% for field in form %}
                        <div class="mb-3">
                            <label>{{ field.label }}</label>
                            {{ field }}
                            <span style="color: red">{{ field.errors.0 }}</span>
                        </div>
                    {% endfor %}
                <div style="margin: 10px">
                    <button type="submit" class="btn btn-primary">提交</button>
                    <a href="/activity/list" class="btn btn-secondary">返回</a>
                </div>
                </form>

            </li>
        </ul>
    </div>
</div>

{% endblock %}

{% block js %}
<script>
$(document).ready(function() {
    // 监听社团选择变化
    $('#id_club').change(function() {
        var clubId = $(this).val();
        var $organizerSelect = $('#id_organizer');
        
        // 清空组织者下拉框
        $organizerSelect.empty();
        $organizerSelect.append('<option value="">---------</option>');
        
        if (clubId) {
            // 发送 AJAX 请求获取该社团的成员
            $.ajax({
                url: '/activity/get-members/',
                data: { 'club_id': clubId },
                dataType: 'json',
                success: function(data) {
                    if (data.members && data.members.length > 0) {
                        $.each(data.members, function(index, member) {
                            $organizerSelect.append(
                                $('<option></option>').val(member.id).text(member.name)
                            );
                        });
                    }
                },
                error: function() {
                    console.log('获取成员列表失败');
                }
            });
        }
    });
});
</script>
{% endblock %}
