{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>登录</title>
    <link rel="stylesheet" href="{% static "bootstrap-5.3.0-alpha1-dist/css/bootstrap.min.css" %}">
    <link rel="stylesheet" href="{% static "MDB5-STANDARD-UI-KIT-Free-6.2.0/css/mdb.min.css" %}">
    <link rel="stylesheet" href="{% static "bootstrap-icons-1.10.4/font/bootstrap-icons.css" %}">
    <link rel="stylesheet" href="{% static "fontawesome-free-6.4.0-web/css/fontawesome.min.css" %}">
    <link rel="stylesheet" href="{% static "fontawesome-free-6.4.0-web/css/brands.min.css" %}">
    <link rel="stylesheet" href="{% static "fontawesome-free-6.4.0-web/css/solid.min.css" %}">
</head>
<body>
    <br>
    <div class="container-md">
        <div class="row">
            <div class="col-md-4 col-sm-2"></div>
            <div class="col-md-4 col-sm-8">
                <ul class="list-group">
                    <li class="list-group-item list-group-item-dark">
                        <i class="bi bi-box-arrow-in-right"></i>
                        <strong>系统登录</strong>
                    </li>
                    <li class="list-group-item">
                        <form method="post">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label class="form-label"><strong>账号</strong></label>
                                {{ form.account }}
                                <span style="color: red;">{{ form.account.errors.0 }}</span>
                                <div class="form-text">管理员填用户名，成员填学号</div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label"><strong>密码</strong></label>
                                {{ form.password }}
                                <span style="color: red;">{{ form.password.errors.0 }}</span>
                            </div>
                            <div class="row">
                                <div class="col-2"></div>
                                <div class="col-8">
                                    <button type="submit" class="btn btn-success" style="width:100%;">登录</button>
                                </div>
                                <div class="col-2"></div>
                            </div>
                        </form>
                    </li>
                </ul>
            </div>
            <div class="col-md-4 col-sm-2"></div>
        </div>
    </div>
    <script src="{% static "bootstrap-5.3.0-alpha1-dist/js/bootstrap.bundle.js" %}"></script>
</body>
</html>
